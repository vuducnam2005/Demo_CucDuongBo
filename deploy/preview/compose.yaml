services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Required}
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      TZ: Asia/Ho_Chi_Minh
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=40]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    mem_limit: 320m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}

  backend:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    user: '10001:10001'
    working_dir: /app
    command: [java, -Xms128m, -Xmx512m, -XX:+ExitOnOutOfMemoryError, -jar, /app/app.jar]
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      SERVER_PORT: '8089'
      HIKARI_MAX_POOL_SIZE: '6'
      HIKARI_MIN_IDLE: '1'
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /data/storage
      LOGGING_FILE_NAME: /tmp/vroad.log
      LOGGING_LEVEL_VN_GOV_DRVN_KCHT: INFO
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./backend/app.jar:/app/app.jar:ro
      - ./storage:/data/storage
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [data]
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      postgres: {condition: service_healthy}
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}

  web:
    image: nginx:alpine
    restart: unless-stopped
    user: '101:101'
    entrypoint: [nginx, -g, 'daemon off;']
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ['127.0.0.1:18090:8080']
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /run:uid=101,gid=101
      - /tmp:uid=101,gid=101
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    networks:
      data:
      edge:
        aliases: [vroad-preview-web]
    depends_on: [backend]
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}

volumes:
  pgdata:

networks:
  data:
    internal: true
  edge:
    external: true
    name: ${EDGE_NETWORK:?Required}
