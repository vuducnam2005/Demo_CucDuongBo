user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format: Structured JSON access log
    log_format json_analytics escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"client_ip":"$remote_addr",'
        '"forwarded_for":"$http_x_forwarded_for",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status_code":$status,'
        '"response_size":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;

    # Basic performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Request size limits (Max 100MB for CAD/GIS document uploads)
    client_max_body_size 100M;
    client_body_buffer_size 1M;

    # Rate Limiting Zones (DDoS & Brute-force protection)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=20r/m;
    limit_req_status 429;

    # Upstream Backends
    upstream backend_api {
        server backend:8089 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_web {
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream minio_storage {
        server minio:9000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # ==============================================================================
    # HTTP Server: Redirect to HTTPS + ACME Challenge & Health Check
    # ==============================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Liveness & Health probe for Edge Load Balancer
        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Let's Encrypt / Certbot ACME Webroot Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Enforce HTTPS redirect for all incoming traffic
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==============================================================================
    # HTTPS Server: TLS Termination & Reverse Proxy Routing
    # ==============================================================================
    server {
        listen 443 ssl reuseport;
        listen [::]:443 ssl reuseport;
        http2 on;
        server_name _;

        # TLS Certificates (Mounted from external secrets or Let's Encrypt volume)
        ssl_certificate /etc/nginx/ssl/kcht_tls.crt;
        ssl_certificate_key /etc/nginx/ssl/kcht_tls.key;

        # TLS Protocols & Cipher Suites (Strict TLS 1.2 & 1.3 only)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;

        # SSL Session Cache & Tickets
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://tile.openstreetmap.org; connect-src 'self'; font-src 'self' data:; frame-ancestors 'self';" always;

        # --------------------------------------------------------------------------
        # 1. Authentication Endpoints: Strict Brute-Force Rate Limiting
        # --------------------------------------------------------------------------
        location ~* ^/api/auth/(login|refresh)$ {
            limit_req zone=auth_limit burst=5 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # --------------------------------------------------------------------------
        # 2. Document & Binary Upload Endpoints
        # --------------------------------------------------------------------------
        location ~* ^/api/documents/upload$ {
            limit_req zone=upload_limit burst=10 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            client_max_body_size 100M;
        }

        # --------------------------------------------------------------------------
        # 3. Core REST API Endpoints
        # --------------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # --------------------------------------------------------------------------
        # 4. OpenAPI / Swagger Documentation
        # --------------------------------------------------------------------------
        location ~* ^/(v3/api-docs|swagger-ui)/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # --------------------------------------------------------------------------
        # 5. Actuator Health Probes (Public Health Check)
        # --------------------------------------------------------------------------
        location = /actuator/health {
            proxy_pass http://backend_api/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            access_log off;
        }

        # Deny public access to all other actuator endpoints (Prometheus, metrics, env, beans)
        location /actuator/ {
            # Only allow internal subnet or Prometheus monitoring scraper
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # --------------------------------------------------------------------------
        # 6. MinIO Storage Direct Proxy
        # --------------------------------------------------------------------------
        location /storage/ {
            proxy_pass http://minio_storage/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # --------------------------------------------------------------------------
        # 7. Frontend SPA Web Application (Root Fallback)
        # --------------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Error Pages
        error_page 500 502 503 504 /custom_50x.html;
        location = /custom_50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
