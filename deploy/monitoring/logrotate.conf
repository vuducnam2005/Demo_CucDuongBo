# ==============================================================================
# LOGROTATE CONFIGURATION FOR KCHT PRODUCTION SERVICES
# ==============================================================================
/var/log/nginx/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 nginx nginx
    sharedscripts
    postrotate
        docker exec kcht_prod_nginx nginx -s reopen > /dev/null 2>&1 || true
    endscript
}

/app/logs/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    copytruncate
}
