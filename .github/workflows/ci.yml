name: KCHT Platform CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  backend-test:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Run Backend Tests
        env:
          POSTGRES_USER: kcht_user
          POSTGRES_PASSWORD: test_password
          JWT_SECRET: test-only-jwt-secret-not-for-production-2026
          STORAGE_ACCESS_KEY: test_access_key
          STORAGE_SECRET_KEY: test_secret_key
        run: |
          ./mvnw clean test -B || {
            echo "=== SUREFIRE REPORTS ==="
            for f in target/surefire-reports/*.txt; do
              [ -e "$f" ] && echo "--- $f ---" && cat "$f"
            done
            exit 1
          }

      - name: Build Spring Boot Application
        run: ./mvnw package -B -DskipTests

  frontend-build:
    name: Frontend Build & Typecheck (Node.js 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build & TypeScript Typecheck
        working-directory: ./frontend
        run: npm run build
